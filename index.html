<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGG Lens Modelling Results</title>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb;
  --panel: #ffffff;
  --line: #e3e2dd;
  --line-strong: #cbcac3;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #86857e;
  --accent: #2a78d6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --ok: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19;
    --panel: #232322;
    --line: #343431;
    --line-strong: #4a4a46;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #92918a;
    --accent: #3987e5;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --panel: #232322; --line: #343431; --line-strong: #4a4a46;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #92918a; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1300px; margin: 0 auto; padding: 0 20px 72px; }

header.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1300px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.brand { font-weight: 650; letter-spacing: -.01em; font-size: 15px; }
.brand span { color: var(--ink-3); font-weight: 400; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs a {
  padding: 6px 12px; border-radius: 7px; color: var(--ink-2);
  font-weight: 500; font-size: 13px;
}
nav.tabs a:hover { background: var(--line); text-decoration: none; }
nav.tabs a.on { background: var(--accent); color: #fff; }

h1 { font-size: 23px; font-weight: 650; letter-spacing: -.02em; margin: 28px 0 4px; }
h2 {
  font-size: 12px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-3);
  margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.sub { color: var(--ink-2); margin: 0 0 4px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ---- badges ---- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid transparent; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-complete { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.b-timeout  { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.b-error, .b-incomplete { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.chip {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--line); color: var(--ink-2); font-size: 12px; font-weight: 500;
}

/* ---- controls ---- */
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 18px 0 14px; }
input[type=search], select {
  font: inherit; padding: 7px 11px; border: 1px solid var(--line-strong);
  border-radius: 8px; background: var(--panel); color: var(--ink);
}
input[type=search] { min-width: 240px; }
input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.count { color: var(--ink-3); font-size: 13px; margin-left: auto; }

/* ---- table ---- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
thead th {
  /* No sticky offset: .tablewrap is an overflow container, so a non-zero top
     would push the header down and leave a gap instead of pinning it. */
  position: sticky; top: 0; z-index: 10;
  background: var(--panel); text-align: left; font-weight: 600; color: var(--ink-2);
  padding: 9px 12px; border-bottom: 1px solid var(--line-strong);
  cursor: pointer; user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--ink); }
thead th .ar { color: var(--accent); font-size: 10px; }
tbody td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
/* _image.png is always a 2000x400 five-panel strip. The colour composite is
   panel 4, measured at x 1216-1484, y 60-330; these offsets crop to it. */
.thumb-box {
  width: 58px; height: 58px; overflow: hidden; border-radius: 6px;
  border: 1px solid var(--line); background: #000; position: relative;
}
.thumb-box img { position: absolute; width: 746%; max-width: none; left: -454%; top: -22.4%; }
td.thumbcell, th.thumbcell { width: 58px; padding-right: 0; }

/* ---- figures ---- */
.figs { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.figs.one { grid-template-columns: 1fr; }
figure.wide { grid-column: 1 / -1; }
figure {
  margin: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow);
}
figure img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
figcaption {
  padding: 9px 12px; font-size: 12px; color: var(--ink-2);
  border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px;
}
figcaption b { color: var(--ink); font-weight: 600; }

/* ---- detail header ---- */
.sysbar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.meta { display: flex; gap: 22px; flex-wrap: wrap; margin: 14px 0 4px; }
.meta div { font-size: 13px; }
.meta dt { color: var(--ink-3); font-size: 11px; letter-spacing: .05em; }
.meta dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }
td.num > span[title] { white-space: nowrap; }
.timing { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-3);
          font-variant-numeric: tabular-nums; }
.pager { display: flex; gap: 10px; align-items: center; margin: 22px 0 0; font-size: 13px; }
.pager .sp { flex: 1; }

.notice {
  border-radius: 10px; padding: 13px 16px; margin: 16px 0;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  background: color-mix(in srgb, var(--warn) 10%, transparent);
  font-size: 13px; color: var(--ink);
}
.notice b { font-weight: 650; }

details.diag { margin-top: 10px; }
details.diag > summary {
  cursor: pointer; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--panel); font-weight: 600; font-size: 13px;
  color: var(--ink-2); list-style: none; display: flex; gap: 8px; align-items: center;
}
details.diag > summary::-webkit-details-marker { display: none; }
details.diag > summary::before { content: "\25B8"; color: var(--ink-3); font-size: 11px; }
details.diag[open] > summary::before { content: "\25BE"; }
details.diag > summary:hover { color: var(--ink); }
details.diag .inner { padding-top: 18px; }

/* ---- stat tiles ---- */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); margin: 18px 0 6px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 15px 17px; box-shadow: var(--shadow);
}
.tile .k { font-size: 11px; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.tile .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin-top: 5px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--ink-2); margin-top: 3px; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.card p.cap { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-2); }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { font-family: inherit; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.bars { display: grid; gap: 5px; }
.barrow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 34px; gap: 12px; align-items: center; }
.barlab { text-align: right; font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.barlab b { color: var(--ink); font-weight: 600; }
.bartrack { height: 15px; }
.bar { height: 100%; border-radius: 4px; min-width: 3px; }
.barval { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .barrow { grid-template-columns: 1fr 44px; }
  .barlab { grid-column: 1 / -1; text-align: left; }
}

.warntable { width: 100%; font-size: 12.5px; border-collapse: collapse; }
.warntable th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.warntable td { padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.warntable td:first-child { color: var(--ink); font-weight: 500; white-space: nowrap; }

/* ---- tooltip + lightbox ---- */
#tip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  transition: opacity .1s; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px;
  font-size: 12px; box-shadow: var(--shadow); max-width: 260px;
}
#tip b { font-weight: 650; }
#lb {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82);
  display: none; align-items: center; justify-content: center; padding: 28px; cursor: zoom-out;
}
#lb.on { display: flex; }
#lb img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; border-radius: 6px; }
#lb .cap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }

.empty { color: var(--ink-3); padding: 40px 0; text-align: center; }

@media (max-width: 620px) {
  .figs { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  thead th { top: 0; }
}
</style>
</head>

<script>
(function () {
"use strict";

var DATA = JSON.parse(document.getElementById("manifest").textContent);
var SYS = DATA.systems;
var BY_ID = {};
SYS.forEach(function (s) { BY_ID[s.id] = s; });

// ---------------------------------------------------------------- helpers
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function num(v, d) {
  return (v == null || isNaN(v)) ? "–" : Number(v).toFixed(d == null ? 2 : d);
}
function el(id) { return document.getElementById(id); }
function figPath(id, key) { return "results/" + id + "/" + id + "_" + key + ".png"; }

var STATUS_LABEL = {
  complete: "Complete",
  timeout: "HMC timed out",
  error: "Pipeline error",
  incomplete: "Incomplete"
};
function badge(s) {
  return '<span class="badge b-' + s.status + '">' + esc(STATUS_LABEL[s.status] || s.status) + "</span>";
}

/* [title, caption, wide?] -- "wide" figures are 4:1 or flatter panel strips and
   are given the full row; squeezed into a column they render as a sliver. */
var FIG_META = {
  HMC_fit:        ["HMC fit", "Observed, model and residual at the posterior mean", 1],
  HMC_components: ["HMC components", "Lens light, source light and lensed source", 1],
  HMC_mass:       ["Lens mass posterior", "EPL + external shear", 0],
  HMC_lenslight:  ["Lens light posterior", "Sérsic ellipse", 0],
  HMC_sourcelight:["Source light posterior", "Sérsic ellipse", 0],
  MAP_fit:        ["MAP fit", "Observed, model and residual at the MAP estimate", 1],
  MAP_components: ["MAP components", "Lens light, source light and lensed source", 1],
  MAP_prior:      ["Priors vs MAP", "Prior density per parameter with the MAP value marked", 0],
  SVI_loss:       ["SVI loss", "Variational loss history", 0],
  image:          ["Observed image", "g, r, i bands, colour composite and mask", 1],
  segment:        ["Segmentation", "Source, lens, other and combined masks", 1],
  kernel:         ["PSF kernel", "Trimmed Legacy Survey PSF", 0]
};

function figures(sys, keys, cls) {
  var have = keys.filter(function (k) { return sys.figs.indexOf(k) >= 0; });
  if (!have.length) return '<p class="empty">No figures on disk.</p>';
  return '<div class="figs' + (cls ? " " + cls : "") + '">' + have.map(function (k) {
    var m = FIG_META[k] || [k, "", 0];
    var p = figPath(sys.id, k);
    return '<figure' + (m[2] ? ' class="wide"' : "") + '><img loading="lazy" src="' + esc(p) +
      '" alt="' + esc(m[0]) + '" data-cap="' + esc(sys.id + " — " + m[0]) + '">' +
      "<figcaption><b>" + esc(m[0]) + "</b><span>" + esc(m[1]) + "</span></figcaption></figure>";
  }).join("") + "</div>";
}

// ---------------------------------------------------------------- browser
var sortKey = "id", sortDir = 1, query = "", statusFilter = "all";

var WALL_CLOCK = 7200;   // every job_*.sh asks SLURM for --time=02:00:00

function dur(sec) {
  if (sec == null) return "\u2013";
  sec = Math.round(sec);
  if (sec < 60) return sec + "s";
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), r = sec % 60;
  if (h) return m ? h + "h " + (m < 10 ? "0" : "") + m + "m" : h + "h";
  return m + "m " + (r < 10 ? "0" : "") + r + "s";
}

/* The logs time three stages and nothing else -- no total job wall time is
   recorded anywhere -- so runtime here means MAP + SVI + HMC sampling, and
   excludes interpreter start-up, data loading and figure writing. A timed-out
   job never finished HMC, but its duration is known exactly: the wall clock. */
function runtimeSec(s) {
  if (s.status === "timeout") return WALL_CLOCK;
  var t = s.times || {};
  if (t.map == null || t.svi == null || t.hmc == null) return null;
  return t.map + t.svi + t.hmc;
}

function stageBreakdown(s) {
  var t = s.times || {}, out = [];
  if (t.map != null) out.push("MAP " + dur(t.map));
  if (t.svi != null) out.push("SVI " + dur(t.svi));
  if (t.hmc != null) out.push("HMC " + dur(t.hmc));
  else if (s.status === "timeout") out.push("HMC never returned");
  return out.join(" \u00b7 ");
}

function runtimeCell(s) {
  var v = runtimeSec(s);
  if (v == null) return "\u2013";
  var tip = s.status === "timeout"
    ? "Killed by the 2-hour wall clock during HMC \u00b7 " + stageBreakdown(s)
    : stageBreakdown(s);
  return '<span title="' + esc(tip) + '">' +
         (s.status === "timeout" ? "\u2265\u2009" : "") + dur(v) + "</span>";
}

function sortVal(s, k) {
  if (k === "id") return Number(s.id);
  if (k === "flags") return s.warns.length;
  if (k === "runtime") return runtimeSec(s);
  if (k === "status") return { complete: 0, timeout: 1, error: 2, incomplete: 3 }[s.status];
  var v = s[k];
  return (v == null || v === "" || (typeof v === "number" && isNaN(v))) ? null : v;
}

/* Missing values (a timed-out run has no chi2) always sink to the bottom,
   in both directions -- otherwise "worst fit first" leads with blank rows. */
function cmp(a, b, k, dir) {
  var x = sortVal(a, k), y = sortVal(b, k);
  if (x === null && y === null) return 0;
  if (x === null) return 1;
  if (y === null) return -1;
  if (typeof x === "string" || typeof y === "string") {
    x = String(x); y = String(y);
    return x < y ? -dir : x > y ? dir : 0;
  }
  return (x - y) * dir;
}

function visible() {
  var q = query.trim().toLowerCase();
  return SYS.filter(function (s) {
    if (statusFilter !== "all" && s.status !== statusFilter) return false;
    if (!q) return true;
    return (s.id + " " + (s.jname || "") + " " + (s.tilename || "")).toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return cmp(a, b, sortKey, sortDir); });
}

var COLS = [
  ["", null, "thumbcell"],
  ["Coadd ID", "id", ""],
  ["Name", "jname", ""],
  ["Tile", "tilename", ""],
  ["RA", "ra", "num"],
  ["Dec", "dec", "num"],
  ["g", "mag_auto_g", "num"],
  ["r", "mag_auto_r", "num"],
  ["i", "mag_auto_i", "num"],
  ["χ² MAP", "chi2_map", "num"],
  ["χ² HMC", "chi2_hmc", "num"],
  ["Runtime", "runtime", "num"],
  ["Status", "status", ""],
  ["Flags", "flags", "num", "MAP parameters that landed near a prior boundary"]
];

function renderBrowser() {
  var rows = visible();
  var head = COLS.map(function (c) {
    if (!c[1]) return '<th class="' + c[2] + '"></th>';
    var ar = sortKey === c[1] ? ' <span class="ar">' + (sortDir > 0 ? "▲" : "▼") + "</span>" : "";
    var ti = c[3] ? ' title="' + esc(c[3]) + '"' : "";
    return '<th class="' + c[2] + '" data-sort="' + c[1] + '"' + ti + ">" + esc(c[0]) + ar + "</th>";
  }).join("");

  var body = rows.map(function (s) {
    return '<tr data-id="' + esc(s.id) + '">' +
      '<td class="thumbcell"><div class="thumb-box"><img loading="lazy" src="' +
        esc(figPath(s.id, "image")) + '" alt=""></div></td>' +
      '<td class="mono">' + esc(s.id) + "</td>" +
      "<td>" + esc(s.jname || "–") + "</td>" +
      '<td class="mono">' + esc(s.tilename || "–") + "</td>" +
      '<td class="num">' + num(s.ra, 4) + "</td>" +
      '<td class="num">' + num(s.dec, 4) + "</td>" +
      '<td class="num">' + num(s.mag_auto_g) + "</td>" +
      '<td class="num">' + num(s.mag_auto_r) + "</td>" +
      '<td class="num">' + num(s.mag_auto_i) + "</td>" +
      '<td class="num">' + num(s.chi2_map) + "</td>" +
      '<td class="num">' + num(s.chi2_hmc) + "</td>" +
      '<td class="num">' + runtimeCell(s) + "</td>" +
      "<td>" + badge(s) + "</td>" +
      '<td class="num">' + (s.warns.length ? esc(s.warns.length) : "–") + "</td>" +
      "</tr>";
  }).join("");

  el("view").innerHTML =
    "<h1>Systems</h1>" +
    '<p class="sub">' + SYS.length + " strong-lensing systems modelled by the AGG pipeline. " +
    "Click a row for the full model results. Runtime is MAP + SVI + HMC sampling \u2014 " +
    "hover it for the per-stage split.</p>" +
    '<div class="controls">' +
      '<input type="search" id="q" placeholder="Filter by ID, name or tile…" value="' + esc(query) + '">' +
      '<select id="sf">' +
        ["all", "complete", "timeout", "error", "incomplete"].map(function (v) {
          var n = v === "all" ? SYS.length : SYS.filter(function (s) { return s.status === v; }).length;
          if (!n && v !== "all") return "";
          var lab = v === "all" ? "All statuses" : STATUS_LABEL[v];
          return '<option value="' + v + '"' + (statusFilter === v ? " selected" : "") + ">" +
                 esc(lab) + " (" + n + ")</option>";
        }).join("") +
      "</select>" +
      '<span class="count">' + rows.length + " shown</span>" +
    "</div>" +
    (rows.length
      ? '<div class="tablewrap"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>"
      : '<p class="empty">No systems match that filter.</p>');

  el("q").addEventListener("input", function (e) {
    query = e.target.value;
    var pos = e.target.selectionStart;
    renderBrowser();
    var q = el("q"); q.focus(); q.setSelectionRange(pos, pos);
  });
  el("sf").addEventListener("change", function (e) { statusFilter = e.target.value; renderBrowser(); });
  Array.prototype.forEach.call(document.querySelectorAll("th[data-sort]"), function (th) {
    th.addEventListener("click", function () {
      var k = th.getAttribute("data-sort");
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      renderBrowser();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("tbody tr"), function (tr) {
    tr.addEventListener("click", function () { location.hash = "#/s/" + tr.getAttribute("data-id"); });
  });
}

// ---------------------------------------------------------------- detail
var HMC_FIGS = ["HMC_fit", "HMC_components"];
var HMC_CORNER = ["HMC_mass", "HMC_lenslight", "HMC_sourcelight"];
var MAP_FIGS = ["MAP_fit", "MAP_components"];
/* "image" is deliberately not here -- it is shown up top to identify the
   system, so repeating it under diagnostics would be redundant. */
var DIAG_FIGS = ["MAP_prior", "SVI_loss", "segment", "kernel"];

function renderSystem(id) {
  var s = BY_ID[id];
  if (!s) { el("view").innerHTML = '<h1>Unknown system</h1><p class="sub"><a href="#/">Back to all systems</a></p>'; return; }

  var order = visible();
  var idx = order.findIndex(function (x) { return x.id === id; });
  if (idx < 0) { order = SYS; idx = order.findIndex(function (x) { return x.id === id; }); }
  var prev = idx > 0 ? order[idx - 1] : null;
  var next = idx >= 0 && idx < order.length - 1 ? order[idx + 1] : null;

  var meta = [
    ["TILE", s.tilename || "–"],
    ["RA", num(s.ra, 5)],
    ["DEC", num(s.dec, 5)],
    ["g / r / i", num(s.mag_auto_g) + " / " + num(s.mag_auto_r) + " / " + num(s.mag_auto_i)],
    ["KRON RADIUS", num(s.kron_radius)],
    ["χ² MAP", num(s.chi2_map)],
    ["χ² HMC", num(s.chi2_hmc)],
    ["RUNTIME", runtimeCell(s)],
    ["SLURM JOB", s.job ? '<span class="mono">' + esc(s.job) + "</span>" : "–"]
  ].map(function (m) { return "<div><dt>" + m[0] + "</dt><dd>" + m[1] + "</dd></div>"; }).join("");

  var primary, note = "";
  if (s.status === "complete") {
    primary =
      "<h2>Model results — HMC posterior</h2>" +
      figures(s, HMC_FIGS.concat(HMC_CORNER));
  } else if (s.status === "timeout") {
    note = '<div class="notice"><b>HMC did not finish.</b> This job was killed by the 2-hour SLURM ' +
      "wall clock while sampling, so no posterior, no χ² and no results file were written. " +
      "The MAP estimate below is the best available model for this system.</div>";
    primary = "<h2>Best available model — MAP estimate</h2>" + figures(s, MAP_FIGS);
  } else if (s.status === "error") {
    note = '<div class="notice"><b>Pipeline error: ' + esc(s.error_type) + ".</b> " +
      "The run failed before completing." +
      (s.error_detail ? "<pre class=\"mono\" style=\"white-space:pre-wrap;margin:8px 0 0;font-size:11.5px\">" +
        esc(s.error_detail) + "</pre>" : "") + "</div>";
    primary = "<h2>Best available model</h2>" + figures(s, MAP_FIGS);
  } else {
    note = '<div class="notice"><b>Run incomplete.</b> No results file was written and no SLURM ' +
      "timeout was recorded for this system.</div>";
    primary = "<h2>Best available model</h2>" + figures(s, MAP_FIGS);
  }

  // Diagnostics: for a complete run MAP belongs here; for a stopped run it is
  // already shown above, so don't repeat it.
  var diagKeys = (s.status === "complete" ? MAP_FIGS : []).concat(DIAG_FIGS);

  var warnHtml = "";
  if (s.warns.length) {
    warnHtml =
      '<div class="card" style="margin-bottom:18px">' +
      "<h3>MAP parameters near prior boundaries (" + s.warns.length + ")</h3>" +
      '<p class="cap">Flagged by <span class="mono">check_prior_boundaries</span> during the run. ' +
      "A parameter pinned to its prior edge suggests the prior is too tight, not that the fit is wrong.</p>" +
      '<table class="warntable"><thead><tr><th>Component</th><th>Parameter</th><th>MAP</th><th>Reason</th></tr></thead><tbody>' +
      s.warns.map(function (w) {
        return "<tr><td>" + esc(w.comp) + '</td><td class="mono">' + esc(w.param) +
          '</td><td class="mono">' + esc(w.val) + "</td><td>" + esc(w.why) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  el("view").innerHTML =
    '<p class="sub" style="margin-top:24px"><a href="#/">← All systems</a></p>' +
    '<div class="sysbar"><h1 style="margin:0">' + esc(s.jname || s.id) + "</h1>" +
      '<span class="chip mono">' + esc(s.id) + "</span>" + badge(s) +
      (s.warns.length ? '<span class="chip">' + s.warns.length + " prior flag" + (s.warns.length > 1 ? "s" : "") + "</span>" : "") +
    "</div>" +
    '<dl class="meta">' + meta + "</dl>" +
    (stageBreakdown(s) ? '<p class="timing">Stage timings: ' +
      esc(stageBreakdown(s)) + "</p>" : "") +
    "<h2>Observed image</h2>" +
    figures(s, ["image"]) +
    note +
    primary +
    "<h2>Diagnostics</h2>" +
    warnHtml +
    '<details class="diag"><summary>Intermediate pipeline output (' + diagKeys.filter(function (k) {
      return s.figs.indexOf(k) >= 0;
    }).length + " figures)</summary><div class=\"inner\">" + figures(s, diagKeys) + "</div></details>" +
    '<div class="pager">' +
      (prev ? '<a href="#/s/' + esc(prev.id) + '">← ' + esc(prev.jname || prev.id) + "</a>" : "<span></span>") +
      '<span class="sp"></span>' +
      (next ? '<a href="#/s/' + esc(next.id) + '">' + esc(next.jname || next.id) + " →</a>" : "<span></span>") +
    "</div>";
}

// ---------------------------------------------------------------- charts
var TICK = "var(--ink-3)", GRID = "var(--line)";

function axisText(x, y, s, anchor, size) {
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || "middle") +
    '" font-size="' + (size || 12) + '" fill="' + TICK + '">' + esc(s) + "</text>";
}

/* Histogram of chi2_HMC. Single series, so no legend: the title names it. */
function histogram(values) {
  var W = 560, H = 320, L = 44, R = 12, T = 12, B = 46;
  var iw = W - L - R, ih = H - T - B;
  var lo = 0.5, hi = 3.0, step = 0.25;
  var nb = Math.round((hi - lo) / step);
  var bins = [], i;
  for (i = 0; i < nb; i++) bins.push({ lo: lo + i * step, hi: lo + (i + 1) * step, n: 0, over: false });
  bins.push({ lo: hi, hi: Infinity, n: 0, over: true });
  values.forEach(function (v) {
    if (v >= hi) { bins[nb].n++; return; }
    var k = Math.floor((v - lo) / step);
    if (k < 0) k = 0;
    if (k >= nb) k = nb - 1;
    bins[k].n++;
  });
  var max = Math.max.apply(null, bins.map(function (b) { return b.n; }));
  var yMax = Math.ceil(max / 5) * 5;
  var bw = iw / bins.length;

  var g = "", k;
  for (k = 0; k <= yMax; k += 5) {
    var y = T + ih - (k / yMax) * ih;
    g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
      '" stroke="' + GRID + '" stroke-width="1"/>' + axisText(L - 8, y + 4, k, "end");
  }
  var bars = bins.map(function (b, j) {
    var h = (b.n / yMax) * ih;
    var x = L + j * bw + 1, y = T + ih - h, w = bw - 2;
    if (h <= 0) return "";
    var lab = b.over ? "χ² > " + hi : b.lo.toFixed(2) + "–" + b.hi.toFixed(2);
    return '<rect class="hov" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="4" fill="' + (b.over ? "var(--s2)" : "var(--s1)") +
      '" data-tip="<b>' + esc(lab) + "</b><br>" + b.n + " system" + (b.n === 1 ? "" : "s") + '"/>';
  }).join("");
  var xl = "";
  bins.forEach(function (b, j) {
    if (j % 2 === 0 || b.over) {
      xl += axisText(L + j * bw + bw / 2, T + ih + 16, b.over ? ">3" : b.lo.toFixed(2));
    }
  });
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Histogram of chi-squared">' +
    g + bars + xl +
    '<line x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) +
    '" stroke="var(--line-strong)" stroke-width="1"/>' +
    axisText(L + iw / 2, H - 8, "χ² (HMC posterior mean)") +
    '<text x="' + 12 + '" y="' + (T + ih / 2) + '" text-anchor="middle" font-size="12" fill="' + TICK +
    '" transform="rotate(-90 12 ' + (T + ih / 2) + ')">Systems</text>' +
    "</svg>";
}

/* MAP vs HMC scatter. Log-log: two outliers at 4.0 and 12.9 would otherwise
   squash the bulk of the sample into one corner. */
function scatter(rows) {
  var W = 560, H = 320, L = 48, R = 14, T = 12, B = 46;
  var iw = W - L - R, ih = H - T - B;
  var lo = 0.5, hi = 14;
  function sx(v) { return L + (Math.log(v / lo) / Math.log(hi / lo)) * iw; }
  function sy(v) { return T + ih - (Math.log(v / lo) / Math.log(hi / lo)) * ih; }
  var ticks = [0.5, 1, 2, 5, 10];
  var g = ticks.map(function (t) {
    return '<line x1="' + sx(t) + '" y1="' + T + '" x2="' + sx(t) + '" y2="' + (T + ih) +
        '" stroke="' + GRID + '"/>' +
      '<line x1="' + L + '" y1="' + sy(t) + '" x2="' + (W - R) + '" y2="' + sy(t) +
        '" stroke="' + GRID + '"/>' +
      axisText(sx(t), T + ih + 16, t) + axisText(L - 9, sy(t) + 4, t, "end");
  }).join("");
  var diag = '<line x1="' + sx(lo) + '" y1="' + sy(lo) + '" x2="' + sx(hi) + '" y2="' + sy(hi) +
    '" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/>' +
    '<text x="' + (sx(0.62)) + '" y="' + (sy(5.5)) + '" font-size="11.5" fill="' + TICK +
    '" text-anchor="start">dashed: \u03C7\u00B2 unchanged</text>';
  var pts = rows.map(function (r) {
    var better = r.chi2_hmc < r.chi2_map;
    return '<circle class="hov" cx="' + sx(r.chi2_map).toFixed(1) + '" cy="' + sy(r.chi2_hmc).toFixed(1) +
      '" r="5" fill="' + (better ? "var(--s1)" : "var(--s2)") +
      '" fill-opacity=".85" stroke="var(--panel)" stroke-width="2"' +
      ' data-tip="<b>' + esc(r.jname || r.id) + "</b><br>" + esc(r.id) +
      "<br>χ² MAP " + num(r.chi2_map) + " → HMC " + num(r.chi2_hmc) +
      '" data-go="' + esc(r.id) + '"/>';
  }).join("");
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="MAP versus HMC chi-squared">' +
    g + diag + pts +
    axisText(L + iw / 2, H - 8, "χ² MAP (log)") +
    '<text x="13" y="' + (T + ih / 2) + '" text-anchor="middle" font-size="12" fill="' + TICK +
    '" transform="rotate(-90 13 ' + (T + ih / 2) + ')">χ² HMC (log)</text>' +
    "</svg>";
}

var COMP_SLOT = {
  "Lens Mass — EPL": "var(--s1)",
  "Lens Mass — Shear": "var(--s2)",
  "Lens Light": "var(--s3)",
  "Source Light": "var(--s4)"
};

/* Horizontal bars as real HTML: this chart sits in a full-width card, and an
   SVG stretched to that width would scale its type up with it. Every row
   carries component and parameter as text, so colour is redundant encoding. */
function flagBars(counts) {
  var max = Math.max.apply(null, counts.map(function (c) { return c.n; }));
  return '<div class="bars">' + counts.map(function (c) {
    return '<div class="barrow">' +
      '<div class="barlab">' + esc(c.comp) + " <b>" + esc(c.param) + "</b></div>" +
      '<div class="bartrack"><div class="bar hov" style="width:' +
        (100 * c.n / max).toFixed(1) + "%;background:" + (COMP_SLOT[c.comp] || "var(--s1)") +
        '" data-tip="<b>' + esc(c.comp + " / " + c.param) + "</b><br>flagged in " + c.n +
        ' of ' + SYS.length + ' runs"></div></div>' +
      '<div class="barval">' + c.n + "</div>" +
    "</div>";
  }).join("") + "</div>";
}

function renderSummary() {
  var complete = SYS.filter(function (s) { return s.status === "complete"; });
  var timeout = SYS.filter(function (s) { return s.status === "timeout"; });
  var errored = SYS.filter(function (s) { return s.status === "error"; });
  var other = SYS.filter(function (s) { return s.status === "incomplete"; });
  var flagged = SYS.filter(function (s) { return s.warns.length; });
  var withBoth = complete.filter(function (s) { return s.chi2_map != null && s.chi2_hmc != null; });
  var improved = withBoth.filter(function (s) { return s.chi2_hmc < s.chi2_map; });
  var chi = complete.map(function (s) { return s.chi2_hmc; }).filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
  var median = chi.length ? (chi.length % 2 ? chi[(chi.length - 1) / 2] : (chi[chi.length / 2 - 1] + chi[chi.length / 2]) / 2) : null;

  // Prior-flag frequency across the whole sample.
  var tally = {};
  SYS.forEach(function (s) {
    s.warns.forEach(function (w) {
      var k = w.comp + "::" + w.param;
      if (!tally[k]) tally[k] = { comp: w.comp, param: w.param, n: 0 };
      tally[k].n++;
    });
  });
  var counts = Object.keys(tally).map(function (k) { return tally[k]; })
    .sort(function (a, b) { return b.n - a.n; });

  var worst = complete.slice().sort(function (a, b) { return b.chi2_hmc - a.chi2_hmc; }).slice(0, 8);

  var tiles = [
    ["SYSTEMS", SYS.length, "modelled in this run"],
    ["COMPLETE", complete.length, pct(complete.length) + " reached HMC"],
    ["HMC TIMED OUT", timeout.length, pct(timeout.length) + " hit the 2 h wall clock"],
    ["PIPELINE ERRORS", errored.length, errored.length ? "see individual systems" : "no run hit an error path"],
    ["MEDIAN χ²", median == null ? "–" : median.toFixed(2), "over " + complete.length + " complete fits"],
    ["PRIOR FLAGS", flagged.length, pct(flagged.length) + " have ≥ 1 pinned parameter"]
  ];
  function pct(n) { return Math.round(100 * n / SYS.length) + "%"; }

  var legend = Object.keys(COMP_SLOT).map(function (c) {
    return '<span><i style="background:' + COMP_SLOT[c] + '"></i>' + esc(c) + "</span>";
  }).join("");

  el("view").innerHTML =
    "<h1>Summary</h1>" +
    '<p class="sub">How the pipeline performed across all ' + SYS.length + " systems.</p>" +
    '<div class="tiles">' + tiles.map(function (t) {
      return '<div class="tile"><div class="k">' + esc(t[0]) + '</div><div class="v">' + esc(t[1]) +
        '</div><div class="n">' + esc(t[2]) + "</div></div>";
    }).join("") + "</div>" +

    (timeout.length ? '<div class="notice"><b>' + timeout.length + " of " + SYS.length +
      " systems were killed by the 2-hour SLURM wall clock during HMC.</b> " +
      "They produced MAP and SVI output but no posterior and no results file. " +
      "Raising <span class=\"mono\">--time</span> in the job template is the fix; " +
      '<a href="#/">filter the table by “HMC timed out”</a> to see which.</div>' : "") +

    "<h2>Fit quality</h2>" +
    '<div class="grid2">' +
      '<div class="card"><h3>Distribution of χ²</h3>' +
      '<p class="cap">Posterior-mean χ² for the ' + complete.length +
        " complete fits. Most cluster near 1, which is what a good fit looks like.</p>" +
      histogram(chi) + "</div>" +
      '<div class="card"><h3>Did HMC improve on MAP?</h3>' +
      '<p class="cap">' + improved.length + " of " + withBoth.length +
        " systems improved. Points below the dashed line got better; blue improved, orange did not. " +
        "Log axes — two systems sit far out at χ² 4 and 13.</p>" +
      scatter(withBoth) + "</div>" +
    "</div>" +

    "<h2>Prior pressure</h2>" +
    '<div class="card">' +
      "<h3>Parameters pinned near their prior boundary</h3>" +
      '<p class="cap">How often each parameter was flagged by <span class="mono">check_prior_boundaries</span> ' +
      "across " + SYS.length + " runs. A parameter near the top is one whose prior is doing the fitting " +
      "instead of the data — the lens centroid and external shear priors are the tightest.</p>" +
      '<div class="legend">' + legend + "</div>" +
      (counts.length ? flagBars(counts) : '<p class="empty">No prior-boundary warnings recorded.</p>') +
    "</div>" +

    "<h2>Worst fits</h2>" +
    '<div class="tablewrap"><table><thead><tr><th>Coadd ID</th><th>Name</th>' +
    '<th class="num">χ² MAP</th><th class="num">χ² HMC</th><th class="num">Prior flags</th></tr></thead><tbody>' +
    worst.map(function (s) {
      return '<tr data-id="' + esc(s.id) + '"><td class="mono">' + esc(s.id) + "</td><td>" +
        esc(s.jname || "–") + '</td><td class="num">' + num(s.chi2_map) + '</td><td class="num">' +
        num(s.chi2_hmc) + '</td><td class="num">' + (s.warns.length || "–") + "</td></tr>";
    }).join("") + "</tbody></table></div>" +
    (other.length ? '<p class="sub" style="margin-top:16px">' + other.length +
      " system(s) are incomplete without a recorded timeout.</p>" : "");

  Array.prototype.forEach.call(document.querySelectorAll("tbody tr[data-id]"), function (tr) {
    tr.addEventListener("click", function () { location.hash = "#/s/" + tr.getAttribute("data-id"); });
  });
}

// ---------------------------------------------------------------- chrome
var tip = el("tip");
document.addEventListener("mouseover", function (e) {
  var t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!t) return;
  tip.innerHTML = t.getAttribute("data-tip");
  tip.style.opacity = "1";
});
document.addEventListener("mousemove", function (e) {
  if (tip.style.opacity !== "1") return;
  var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  var x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("mouseout", function (e) {
  var t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) tip.style.opacity = "0";
});
document.addEventListener("click", function (e) {
  var g = e.target.closest ? e.target.closest("[data-go]") : null;
  if (g) { tip.style.opacity = "0"; location.hash = "#/s/" + g.getAttribute("data-go"); }
});

var lb = el("lb");
document.addEventListener("click", function (e) {
  var img = e.target.closest ? e.target.closest("figure img") : null;
  if (!img) return;
  lb.querySelector("img").src = img.src;
  lb.querySelector(".cap").textContent = img.getAttribute("data-cap") || "";
  lb.classList.add("on");
});
lb.addEventListener("click", function () { lb.classList.remove("on"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") lb.classList.remove("on"); });

function route() {
  var h = location.hash || "#/";
  el("tab-browse").classList.toggle("on", h === "#/" || h.indexOf("#/s/") === 0);
  el("tab-summary").classList.toggle("on", h === "#/summary");
  if (h === "#/summary") renderSummary();
  else if (h.indexOf("#/s/") === 0) renderSystem(decodeURIComponent(h.slice(4)));
  else renderBrowser();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();

})();
</script>
</body>
</html>
